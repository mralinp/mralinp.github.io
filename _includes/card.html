{%- comment -%} A project or book card. {%- endcomment -%}
{%- assign p = include.post -%}
<article class="card">
  {%- if p.img %}<img loading="lazy" src="{{ p.img }}" alt="">{% endif %}
  <div class="body">
    <h3><a href="{{ p.url }}">{{ p.title }}</a></h3>
    {%- if p.brief %}<p>{{ p.brief | strip_html | truncate: 140 }}</p>{% endif %}
    <div class="chips">{% for t in p.categories offset: 1 limit: 3 %}<span class="chip">{% include tag.html t=t %}</span>{% endfor %}</div>
  </div>
</article>
