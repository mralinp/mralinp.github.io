<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Windows sign-in with a FIDO2 security key</title>
  <desc id="d">The sign-in screen loads a credential provider, which asks a background authentication service to authenticate the user. The service uses a local FIDO server as the relying party and talks to the security key. On success it returns a Windows credential to the credential provider, which hands it to the sign-in screen.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#e879f9"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a7abc7"/></marker>
  </defs>
  <rect width="880" height="520" fill="#0b0c16"/>
  <rect width="880" height="3" fill="url(#g)"/>

  <!-- boundaries -->
  <rect x="24" y="36" width="560" height="460" fill="none" stroke="#2c2f48" stroke-dasharray="6 6"/>
  <text x="40" y="60" fill="#a7abc7" font-size="12" font-family="JetBrains Mono, monospace" letter-spacing="1.5">WINDOWS PC</text>
  <rect x="620" y="36" width="236" height="460" fill="none" stroke="#2c2f48" stroke-dasharray="6 6"/>
  <text x="636" y="60" fill="#a7abc7" font-size="12" font-family="JetBrains Mono, monospace" letter-spacing="1.5">AUTHENTICATOR</text>

  <!-- boxes -->
  <g fill="#161a2e" stroke="#3b3f63">
    <rect x="56" y="84" width="236" height="76"/>
    <rect x="56" y="224" width="236" height="92"/>
    <rect x="336" y="224" width="220" height="92"/>
    <rect x="56" y="388" width="500" height="76"/>
    <rect x="652" y="224" width="172" height="92"/>
  </g>
  <g fill="#8b5cf6"><rect x="56" y="224" width="4" height="92"/><rect x="336" y="224" width="4" height="92"/><rect x="56" y="388" width="4" height="76"/></g>

  <g fill="#f5f6ff" font-size="16" font-weight="600">
    <text x="76" y="114">Windows sign-in screen</text>
    <text x="76" y="254">Credential provider</text>
    <text x="356" y="254">Local FIDO server</text>
    <text x="76" y="418">Authentication service</text>
    <text x="672" y="254">FIDO2 security key</text>
  </g>
  <g fill="#a7abc7" font-size="13">
    <text x="76" y="138">LogonUI, owned by Windows</text>
    <text x="76" y="278">C++ DLL loaded by LogonUI.</text>
    <text x="76" y="297">Shows the sign-in option.</text>
    <text x="356" y="278">Relying party: issues</text>
    <text x="356" y="297">challenges, verifies responses</text>
    <text x="76" y="442">Windows service, starts at boot. Handles register and authenticate requests.</text>
    <text x="672" y="278">IDmelon or any</text>
    <text x="672" y="297">FIDO2 key</text>
  </g>

  <!-- arrows -->
  <g stroke="#a7abc7" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M174 160 V218"/>
    <path d="M150 316 V382"/>
    <path d="M200 382 V322"/>
    <path d="M446 382 V322"/>
  </g>
  <g fill="#f87171" font-size="12" font-family="JetBrains Mono, monospace">
    <text x="182" y="194">1 sign in</text>
    <text x="60" y="354">2 authenticate</text>
    <text x="208" y="354">5 credential</text>
    <text x="454" y="354">3 challenge / verify</text>
    <text x="592" y="258">4 FIDO2</text>
  </g>
  <path d="M588 270 H646" stroke="#a7abc7" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="56" y="486" fill="#6b7394" font-size="12">Component boundaries only; not every internal call is shown.</text>
</svg>
